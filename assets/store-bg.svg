<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#1d5c94" stop-opacity=".85"/>
      <stop offset="38%" stop-color="#0d2a45" stop-opacity=".85"/>
      <stop offset="72%" stop-color="#060d16" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#030508" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b8fe0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#2b8fe0" stop-opacity=".10"/>
      <stop offset="55%" stop-color="#7fc4ff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".75"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#030508"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#sheen)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- faint horizon line, like the home screen's lower edge -->
  <rect x="0" y="742" width="1920" height="1" fill="#2f6f9f" opacity=".18"/>
  <rect x="0" y="744" width="1920" height="120" fill="#0a1a29" opacity=".35"/>
</svg>
